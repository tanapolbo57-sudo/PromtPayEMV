<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PayHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --green: #1D9E75;
  --green-d: #0d7a5a;
  --white: #ffffff;
}

html, body {
  min-height: 100vh;
  font-family: 'Prompt', sans-serif;
  overflow-x: hidden;
}

/* ── Animated gradient background ── */
body {
  background: #0a1628;
  position: relative;
}

.bg-canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
}

/* Mesh gradient blobs */
.blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.55;
  animation: drift linear infinite;
}
.blob-1 {
  width: 600px; height: 600px;
  background: radial-gradient(circle, #1a6b8a 0%, transparent 70%);
  top: -150px; left: -100px;
  animation-duration: 22s;
  animation-delay: 0s;
}
.blob-2 {
  width: 500px; height: 500px;
  background: radial-gradient(circle, #1D9E75 0%, transparent 70%);
  top: 10%; right: -80px;
  animation-duration: 18s;
  animation-delay: -6s;
}
.blob-3 {
  width: 700px; height: 700px;
  background: radial-gradient(circle, #2d1b69 0%, transparent 70%);
  bottom: -200px; left: 20%;
  animation-duration: 25s;
  animation-delay: -12s;
}
.blob-4 {
  width: 400px; height: 400px;
  background: radial-gradient(circle, #0e4d6b 0%, transparent 70%);
  bottom: 10%; right: 10%;
  animation-duration: 20s;
  animation-delay: -4s;
}
.blob-5 {
  width: 350px; height: 350px;
  background: radial-gradient(circle, #1a3a5c 0%, transparent 70%);
  top: 40%; left: 40%;
  animation-duration: 28s;
  animation-delay: -9s;
}

@keyframes drift {
  0%   { transform: translate(0px, 0px) scale(1); }
  25%  { transform: translate(40px, -30px) scale(1.05); }
  50%  { transform: translate(-20px, 50px) scale(0.97); }
  75%  { transform: translate(-40px, -20px) scale(1.03); }
  100% { transform: translate(0px, 0px) scale(1); }
}

/* Noise texture overlay */
.bg-canvas::after {
  content: '';
  position: absolute;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  opacity: 0.4;
  pointer-events: none;
}

/* Grid lines */
.bg-grid {
  position: fixed;
  inset: 0;
  z-index: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
  background-size: 60px 60px;
  pointer-events: none;
}

/* ── Page layout ── */
.page {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 3rem 1.5rem;
}

/* ── Header ── */
.header {
  text-align: center;
  margin-bottom: 3.5rem;
  animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
}

.header-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 11px;
  font-weight: 400;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.35);
  margin-bottom: 14px;
  font-family: 'DM Sans', sans-serif;
}
.eyebrow-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 8px var(--green);
}

.header h1 {
  font-size: clamp(2.4rem, 6vw, 3.5rem);
  font-weight: 600;
  letter-spacing: -1.5px;
  color: var(--white);
  line-height: 1.1;
  margin-bottom: 10px;
}

.header h1 .accent {
  background: linear-gradient(135deg, #4dd9a8 0%, #1D9E75 50%, #0d7a5a 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.header p {
  font-size: 15px;
  font-weight: 300;
  color: rgba(255,255,255,0.4);
  letter-spacing: 0.2px;
}

/* ── Icon grid ── */
.icon-grid {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 28px;
  max-width: 520px;
}

/* ── App icon ── */
.app-icon-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
}

.app-icon-wrap:nth-child(1) { animation-delay: 0.1s; }
.app-icon-wrap:nth-child(2) { animation-delay: 0.17s; }
.app-icon-wrap:nth-child(3) { animation-delay: 0.24s; }
.app-icon-wrap:nth-child(4) { animation-delay: 0.31s; }
.app-icon-wrap:nth-child(5) { animation-delay: 0.38s; }
.app-icon-wrap:nth-child(6) { animation-delay: 0.45s; }

.app-icon {
  width: 88px;
  height: 88px;
  border-radius: 22px; /* macOS icon rounding ratio */
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  position: relative;
  transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  text-decoration: none;
  -webkit-tap-highlight-color: transparent;

  /* Glass effect */
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}

.app-icon:hover {
  transform: scale(1.12) translateY(-4px);
}

.app-icon:active {
  transform: scale(0.95);
  transition: transform 0.1s ease;
}

/* Shine overlay on hover */
.app-icon::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: linear-gradient(135deg, rgba(255,255,255,0.25) 0%, transparent 60%);
  opacity: 0;
  transition: opacity 0.2s;
}
.app-icon:hover::before { opacity: 1; }

/* Inner border glow */
.app-icon::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  border: 1px solid rgba(255,255,255,0.2);
  pointer-events: none;
}

.app-name {
  font-size: 12px;
  font-weight: 400;
  color: rgba(255,255,255,0.7);
  letter-spacing: 0.2px;
  text-align: center;
  font-family: 'Prompt', sans-serif;
}

/* ── Individual icon colors ── */

/* PromptPay — green gradient */
.icon-promptpay {
  background: linear-gradient(145deg, #1fc98a 0%, #0d8f5f 50%, #085e40 100%);
  box-shadow:
    0 8px 32px rgba(29,158,117,0.45),
    0 2px 8px rgba(0,0,0,0.3),
    inset 0 1px 0 rgba(255,255,255,0.2);
}

/* Placeholder icons — styled but dimmed */
.icon-placeholder {
  background: linear-gradient(145deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.05) 100%);
  box-shadow:
    0 4px 20px rgba(0,0,0,0.25),
    inset 0 1px 0 rgba(255,255,255,0.08);
  border: 1px dashed rgba(255,255,255,0.12) !important;
  cursor: default;
}
.icon-placeholder::before { display: none; }
.icon-placeholder:hover { transform: none; }
.icon-placeholder .icon-svg { opacity: 0.25; }

/* Icon SVGs */
.icon-svg {
  width: 44px;
  height: 44px;
  flex-shrink: 0;
}

/* ── Tooltip "coming soon" ── */
.app-icon-wrap.coming .app-name {
  color: rgba(255,255,255,0.3);
  font-style: italic;
}

/* ── Footer ── */
.footer {
  margin-top: 4rem;
  font-size: 11px;
  color: rgba(255,255,255,0.18);
  letter-spacing: 0.5px;
  text-align: center;
  font-family: 'DM Sans', sans-serif;
  animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.6s both;
}

/* ── Animations ── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── Mobile ── */
@media (max-width: 480px) {
  .icon-grid { gap: 20px; max-width: 340px; }
  .app-icon { width: 76px; height: 76px; border-radius: 19px; }
  .icon-svg { width: 38px; height: 38px; }
  .header { margin-bottom: 2.5rem; }
}
</style>
</head>
<body>

<!-- Background -->
<div class="bg-canvas">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div class="blob blob-4"></div>
  <div class="blob blob-5"></div>
</div>
<div class="bg-grid"></div>

<div class="page">

  <!-- Header -->
  <div class="header">

      Developer
      <span class="eyebrow-dot"></span>
    </div>

  <div class="icon-grid">

          <rect x="35" y="25" width="3" height="3" rx=".6" fill="white"/>
          <rect x="25" y="30" width="3" height="3" rx=".6" fill="white"/>

      <span class="app-name">PromptPay</span>

    <!-- 2-6. Coming soon slots -->
    <div class="app-icon-wrap coming">
      <div class="app-icon icon-placeholder">
        <svg class="icon-svg" viewBox="0 0 44 44" fill="none">
          <rect x="10" y="10" width="24" height="18" rx="3" stroke="white" stroke-width="2"/>
          <path d="M14 32h16M18 28v4M26 28v4" stroke="white" stroke-width="2" stroke-linecap="round"/>

        </svg>
      </div>
      <span class="app-name">coming soon</span>
    </div>

    <div class="app-icon-wrap coming">
      <div class="app-icon icon-placeholder">
        <svg class="icon-svg" viewBox="0 0 44 44" fill="none">
          <circle cx="22" cy="17" r="6" stroke="white" stroke-width="2"/>
          <path d="M10 34c0-6.627 5.373-10 12-10s12 3.373 12 10" stroke="white" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <span class="app-name">coming soon</span>
    </div>

    <div class="app-icon-wrap coming">
      <div class="app-icon icon-placeholder">
        <svg class="icon-svg" viewBox="0 0 44 44" fill="none">
          <rect x="9" y="14" width="26" height="18" rx="3" stroke="white" stroke-width="2"/>
          <path d="M9 19h26" stroke="white" stroke-width="1.8"/>
          <path d="M14 25h4M14 29h8" stroke="white" stroke-width="1.8" stroke-linecap="round" opacity=".6"/>
          <rect x="16" y="9" width="3" height="6" rx="1.5" fill="white" opacity=".5"/>
          <rect x="25" y="9" width="3" height="6" rx="1.5" fill="white" opacity=".5"/>
        </svg>
      </div>
      <span class="app-name">coming soon</span>
    </div>

    <div class="app-icon-wrap coming">
      <div class="app-icon icon-placeholder">
        <svg class="icon-svg" viewBox="0 0 44 44" fill="none">
          <path d="M22 8l3.5 7 7.7 1.1-5.6 5.4 1.3 7.7L22 25.7l-6.9 3.5 1.3-7.7-5.6-5.4 7.7-1.1z" stroke="white" stroke-width="2" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="app-name">coming soon</span>
    </div>

    <div class="app-icon-wrap coming">
      <div class="app-icon icon-placeholder">
        <svg class="icon-svg" viewBox="0 0 44 44" fill="none">
          <circle cx="22" cy="22" r="12" stroke="white" stroke-width="2"/>
          <path d="M22 15v7l4 4" stroke="white" stroke-width="2" stroke-linecap="round"/>
          <circle cx="22" cy="22" r="1.5" fill="white"/>
        </svg>
      </div>
      <span class="app-name">coming soon</span>
    </div>

  </div>

  <!-- Footer -->
  <div class="footer">DoublePHub &nbsp;·&nbsp; &nbsp;·&nbsp; v1.0</div>

</div>
</body>
</html>
